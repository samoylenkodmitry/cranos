[workspace]
resolver = "2"
members = [
    "crates/cranos-boot-info",
    "crates/cranos-boot",
    "crates/cranos-llm",
    "crates/cranos-kernel",
]
# cranos-boot and cranos-kernel compile for different targets, so scripts/build.sh
# builds each member with its own target.
default-members = ["crates/cranos-boot-info", "crates/cranos-llm"]

[patch.crates-io]
web-time = { path = "crates/cranos-web-time" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0

[profile.dev]
opt-level = 1
panic = "abort"
